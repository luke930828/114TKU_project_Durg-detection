[pytest]
testpaths = integration security
python_files = test_*.py
addopts = -ra --strict-markers --timeout=120 --tb=short
markers =
    integration: 模組間介面契約，應該全部通過
    security: 資安測試，已知漏洞以 xfail 呈現
    fullstack: 需要真實 NLP/YOLO 模型（make test-full 才跑）
    slow: 較慢的測試
    vuln_id(id): 對應 vulns.py 的發現編號，由 known_vuln 自動加上
